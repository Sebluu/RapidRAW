name: Effect Studio v1.6.9 validation
on:
  push:
    branches: [feature/effect-studio-v1.6.9]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: effect-studio-v169-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-effect-studio.mjs
      - name: TypeScript and ESLint regressions
        run: |
          git worktree add --detach "$RUNNER_TEMP/rapidraw-upstream" 820d14409efe52a7711257e2d2eb7175b738b056
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/rapidraw-upstream/node_modules"
          node scripts/check-typecheck-regressions.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rapidraw-upstream"
          node scripts/check-eslint-regressions.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rapidraw-upstream"
      - run: npm run build
      - run: npm run i18n:runtime-check
      - name: Feature formatting
        run: npx prettier --check src/components/panel/right/PrismStudioPanel.tsx src/components/panel/right/studio/*.tsx src/components/ui/OptionPicker.tsx src/components/ui/Switch.tsx src/utils/effectStudio.ts src/i18n/locales/en.json src/i18n/locales/de.json scripts/test-effect-studio.mjs docs/prism-studio.md
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config patchelf libgphoto2-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
  shader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/shader-validation
      - run: cargo run --locked --manifest-path tools/shader-validation/Cargo.toml
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: GPU effect behavior
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: cargo test --locked --manifest-path tools/shader-validation/Cargo.toml
