name: Temporary UI formatting snapshot
on:
  push:
    branches:
      - test/harmonizer-and-curves
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Prettier only to updated sources on temporary runner
        run: |
          npx prettier --write src/components/panel/editor/ImageCanvas.tsx src/components/adjustments/AdjustmentSubSection.tsx src/utils/canvasControls.ts src/components/adjustments/ColorHarmonizer.tsx
      - name: Export reviewed formatted sources to logs
        run: |
          for file in src/components/panel/editor/ImageCanvas.tsx src/components/adjustments/AdjustmentSubSection.tsx src/utils/canvasControls.ts src/components/adjustments/ColorHarmonizer.tsx; do
            echo "FORMATTED_START $file"
            base64 -w0 "$file" | fold -w 2500 | sed 's/^/FORMATTED_CHUNK /'
            echo "FORMATTED_END $file"
          done
