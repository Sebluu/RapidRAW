name: Targeted Curves — formatting snapshot
on:
  push:
    branches:
      - feature/targeted-curves
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate formatted versions in runner workspace only
        run: |
          npx prettier --write src/components/adjustments/Curves.tsx src/components/panel/editor/ImageCanvas.tsx src/store/useEditorStore.ts docs/targeted-curves.md
          node scripts/print-formatted-files.mjs