name: Prism Studio — validation
on:
  push:
    branches:
      - feature/prism-studio
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: prism-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Effect Studio model tests
        run: node --test scripts/test-effect-studio.mjs
      - name: Production build
        run: npm run build
      - name: Formatting (modified files)
        if: success() || failure()
        run: npx prettier --check src/App.tsx src/components/ui/AppProperties.tsx src/store/useUIStore.ts src/components/panel/PanelSwitcher.tsx src/components/panel/right/PrismStudioPanel.tsx src/components/panel/right/studio/KaleidoscopeControls.tsx src/components/panel/right/studio/CreativeEffectControls.tsx src/components/ui/OptionPicker.tsx src/utils/effectStudio.ts scripts/test-effect-studio.mjs src/i18n/locales/en.json src/i18n/locales/de.json docs/prism-studio.md

      - name: Diagnose formatting differences
        if: failure()
        run: |
          npx prettier --write src/components/panel/right/PrismStudioPanel.tsx src/components/panel/right/studio/CreativeEffectControls.tsx scripts/test-effect-studio.mjs docs/prism-studio.md
          git --no-pager diff -- src/components/panel/right/PrismStudioPanel.tsx src/components/panel/right/studio/CreativeEffectControls.tsx scripts/test-effect-studio.mjs docs/prism-studio.md

  shader:
    name: WGSL parser and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libgphoto2-dev patchelf
      - name: Validate WGSL with Naga
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test shader_validation -- --nocapture
