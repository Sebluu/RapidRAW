name: Temporary Harmonizer formatting snapshot
on:
  push:
    branches: [test/harmonizer-and-curves]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: npm ci
      - name: Format touched files on runner
        run: |
          npx prettier --write src/components/adjustments/ColorHarmonizer.tsx src/components/adjustments/HarmonyRulePicker.tsx src/components/adjustments/Color.tsx src/utils/adjustments.ts
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Emit formatter output as base64 for review
        run: |
          for file in src/components/adjustments/ColorHarmonizer.tsx src/components/adjustments/HarmonyRulePicker.tsx src/components/adjustments/Color.tsx src/utils/adjustments.ts src-tauri/src/image_processing.rs; do
            echo "FORMATTED_START $file"
            base64 -w0 "$file" | fold -w 2500 | sed 's/^/FORMATTED_CHUNK /'
            echo "FORMATTED_END $file"
          done
