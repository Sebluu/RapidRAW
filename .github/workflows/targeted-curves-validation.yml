name: Targeted Curves — validation

# Only this experimental feature and PRs to the fork's main branch.
on:
  push:
    branches:
      - feature/targeted-curves
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targeted-curves-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — build & regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript errors relative to untouched main
        run: |
          git worktree add --detach "$RUNNER_TEMP/rapidraw-main" origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/rapidraw-main/node_modules"
          node scripts/check-typecheck-regressions.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rapidraw-main"
      - name: ESLint (changed UI files)
        if: success() || failure()
        run: npx eslint src/components/adjustments/Curves.tsx src/components/panel/editor/ImageCanvas.tsx src/components/panel/Editor.tsx src/store/useEditorStore.ts src/components/ui/AppProperties.tsx
      - name: Vite build
        if: success() || failure()
        run: npm run build
      - name: Changed file formatting
        if: success() || failure()
        run: npx prettier --check src/components/adjustments/Curves.tsx src/components/panel/editor/ImageCanvas.tsx src/components/panel/Editor.tsx src/store/useEditorStore.ts src/components/ui/AppProperties.tsx docs/targeted-curves.md

  rust:
    name: Rust — format & cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libgphoto2-dev patchelf
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust compilation
        if: success() || failure()
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
