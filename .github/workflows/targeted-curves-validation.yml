name: Targeted Curves — validation

# Isolated to the experimental branch; no releases or deployment.
on:
  push:
    branches:
      - feature/targeted-curves
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targeted-curves-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, lint & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly the locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vite build
        run: npm run build
      - name: Formatting of modified UI files and feature documentation
        run: npx prettier --check src/components/adjustments/Curves.tsx src/components/panel/editor/ImageCanvas.tsx src/components/panel/Editor.tsx src/store/useEditorStore.ts src/components/ui/AppProperties.tsx docs/targeted-curves.md

  rust:
    name: Rust — format & cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libgphoto2-dev patchelf
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust compilation (includes WGSL compile validation at runtime only)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
