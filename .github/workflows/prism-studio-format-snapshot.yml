name: Prism Studio — formatting snapshot
on:
  push:
    branches:
      - feature/prism-studio
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format files in runner only
        run: npx prettier --write src/App.tsx src/components/ui/AppProperties.tsx src/store/useUIStore.ts src/components/panel/PanelSwitcher.tsx src/components/panel/right/PrismStudioPanel.tsx src/i18n/locales/en.json src/i18n/locales/de.json docs/prism-studio.md
      - name: Emit only changed files as base64
        run: |
          for file in $(git diff --name-only); do
            echo "FORMATTED_START $file"
            base64 -w0 "$file" | fold -w 2600 | sed 's/^/FORMATTED_CHUNK /'
            echo "FORMATTED_END $file"
          done
